name: Build VSIX for testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "client/**"
      - "server/**"
      - "l10n/**"
      - "themes/**"
      - "syntaxes/**"
      - "snippets/**"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.js"
      - ".github/workflows/build-vsix.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "l10n/**"
      - "themes/**"
      - "syntaxes/**"
      - "snippets/**"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.js"
      - ".github/workflows/build-vsix.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npx @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ github.ref_name }}-${{ github.sha }}
          path: ./*.vsix
          retention-days: 5
